name: CI Quality Gate (Lint & Compilation)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Backend Lint & Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio
          pip install -r backend/requirements.txt

      - name: Python Syntax Compilation Check
        run: |
          python -m compileall -q backend

      - name: Python Lint Check (flake8)
        run: |
          flake8 --max-line-length=120 --ignore=E501,E402 --exclude=venv,__pycache__ backend

      - name: Run Backend Tests
        run: |
          cd backend
          pytest

  frontend-checks:
    name: Frontend Lint & Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend ESLint Check
        run: |
          cd frontend
          npm run lint

      - name: Frontend TypeScript Compilation Check (tsc)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Frontend Next.js Production Build Check
        run: |
          cd frontend
          npm run build
